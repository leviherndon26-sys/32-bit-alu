<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1060" viewBox="0 0 1600 1060" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <g id="and"><path d="M0,0 H30 A20,20 0 0 1 30,40 H0 Z"/></g>
    <g id="xor"><path d="M8,0 Q28,0 58,20 Q28,40 8,40 Q20,20 8,0 Z"/><path d="M0,0 Q12,20 0,40" fill="none"/></g>
    <g id="xnor"><use href="#xor" xlink:href="#xor"/><circle cx="63" cy="20" r="5"/></g>
    <g id="nor"><path d="M0,0 Q20,0 50,20 Q20,40 0,40 Q12,20 0,0 Z"/><circle cx="55" cy="20" r="5"/></g>
  </defs>

  <rect width="1600" height="1060" fill="#FFFFFF"/>

  <!-- drawing frame -->
  <rect x="20" y="20" width="1560" height="1020" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="30" y="30" width="1540" height="1000" fill="none" stroke="#000" stroke-width="1"/>

  <!-- module boundary -->
  <rect x="170" y="90" width="1250" height="840" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="8 5"/>
  <text x="180" y="110" font-size="14" fill="#444">ALU</text>

  <g stroke="#000" stroke-width="2" fill="none">
    <!-- a bus -->
    <line x1="144" y1="175" x2="380" y2="175"/>
    <line x1="200" y1="175" x2="200" y2="600"/>
    <line x1="200" y1="325" x2="380" y2="325"/>
    <line x1="200" y1="480" x2="380" y2="480"/>
    <line x1="200" y1="600" x2="380" y2="600"/>
    <!-- b bus -->
    <line x1="144" y1="720" x2="250" y2="720"/>
    <line x1="250" y1="720" x2="250" y2="225"/>
    <line x1="250" y1="225" x2="380" y2="225"/>
    <line x1="250" y1="375" x2="290" y2="375"/>
    <line x1="342" y1="375" x2="380" y2="375"/>
    <line x1="250" y1="520" x2="380" y2="520"/>
    <line x1="250" y1="640" x2="380" y2="640"/>
    <!-- adder cin / cout stubs -->
    <line x1="430" y1="150" x2="430" y2="132"/>
    <line x1="480" y1="235" x2="515" y2="235"/>
    <line x1="430" y1="300" x2="430" y2="282"/>
    <line x1="480" y1="385" x2="515" y2="385"/>
    <!-- datapath to mux -->
    <line x1="480" y1="200" x2="640" y2="200"/>
    <line x1="480" y1="350" x2="640" y2="350"/>
    <line x1="480" y1="500" x2="640" y2="500"/>
    <line x1="480" y1="620" x2="640" y2="620"/>
    <!-- result -->
    <line x1="700" y1="430" x2="1450" y2="430"/>
    <!-- op -->
    <line x1="144" y1="900" x2="670" y2="900"/>
    <line x1="670" y1="900" x2="670" y2="690"/>
    <!-- negative -->
    <line x1="800" y1="430" x2="800" y2="520"/>
    <line x1="800" y1="520" x2="1450" y2="520"/>
    <!-- zero -->
    <line x1="860" y1="430" x2="860" y2="475"/>
    <line x1="860" y1="475" x2="946" y2="475"/>
    <line x1="1000" y1="475" x2="1450" y2="475"/>
    <!-- carry mux inputs / output / select -->
    <line x1="1160" y1="580" x2="1200" y2="580"/>
    <line x1="1160" y1="605" x2="1200" y2="605"/>
    <line x1="1160" y1="630" x2="1200" y2="630"/>
    <line x1="1160" y1="655" x2="1200" y2="655"/>
    <line x1="1240" y1="620" x2="1450" y2="620"/>
    <line x1="1220" y1="670" x2="1220" y2="690"/>
    <!-- overflow gate inputs -->
    <line x1="860" y1="710" x2="913" y2="710"/>
    <line x1="860" y1="730" x2="913" y2="730"/>
    <line x1="860" y1="770" x2="913" y2="770"/>
    <line x1="860" y1="790" x2="913" y2="790"/>
    <line x1="860" y1="830" x2="913" y2="830"/>
    <line x1="860" y1="850" x2="913" y2="850"/>
    <line x1="860" y1="890" x2="913" y2="890"/>
    <line x1="860" y1="910" x2="913" y2="910"/>
    <!-- overflow gate interconnect -->
    <polyline points="968,720 1005,720 1005,740 1040,740"/>
    <polyline points="958,780 1020,780 1020,760 1040,760"/>
    <polyline points="958,840 1005,840 1005,860 1040,860"/>
    <polyline points="958,900 1020,900 1020,880 1040,880"/>
    <line x1="1090" y1="750" x2="1200" y2="750"/>
    <polyline points="1090,870 1110,870 1110,775 1200,775"/>
    <line x1="1160" y1="800" x2="1200" y2="800"/>
    <line x1="1160" y1="825" x2="1200" y2="825"/>
    <line x1="1240" y1="790" x2="1450" y2="790"/>
    <line x1="1220" y1="840" x2="1220" y2="860"/>
  </g>

  <!-- bus width slashes -->
