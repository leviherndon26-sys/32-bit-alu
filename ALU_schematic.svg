    <line x1="163" y1="727" x2="177" y2="713"/>
    <line x1="323" y1="527" x2="337" y2="513"/>
    <line x1="323" y1="647" x2="337" y2="633"/>
    <line x1="593" y1="207" x2="607" y2="193"/>
    <line x1="593" y1="357" x2="607" y2="343"/>
    <line x1="593" y1="507" x2="607" y2="493"/>
    <line x1="593" y1="627" x2="607" y2="613"/>
    <line x1="1393" y1="437" x2="1407" y2="423"/>
    <line x1="893" y1="482" x2="907" y2="468"/>
    <line x1="193" y1="907" x2="207" y2="893"/>
  </g>
  <g font-size="12" fill="#000">
    <text x="174" y="164">32</text>
    <text x="174" y="709">32</text>
    <text x="336" y="510">5</text>
    <text x="336" y="630">5</text>
    <text x="604" y="190">32</text>
    <text x="604" y="340">32</text>
    <text x="604" y="490">32</text>
    <text x="604" y="610">32</text>
    <text x="1404" y="420">32</text>
    <text x="904" y="465">32</text>
    <text x="204" y="889">2</text>
  </g>

  <!-- junction dots -->
  <g fill="#000">
    <circle cx="200" cy="175" r="4.5"/><circle cx="200" cy="325" r="4.5"/><circle cx="200" cy="480" r="4.5"/>
    <circle cx="250" cy="375" r="4.5"/><circle cx="250" cy="520" r="4.5"/><circle cx="250" cy="640" r="4.5"/>
    <circle cx="800" cy="430" r="4.5"/><circle cx="860" cy="430" r="4.5"/>
  </g>

  <!-- ports -->
  <g stroke="#000" stroke-width="1.8" fill="#FFFFFF">
    <polygon points="50,161 130,161 144,175 130,189 50,189"/>
    <polygon points="50,706 130,706 144,720 130,734 50,734"/>
    <polygon points="50,886 130,886 144,900 130,914 50,914"/>
    <polygon points="1450,416 1530,416 1544,430 1530,444 1450,444"/>
    <polygon points="1450,461 1530,461 1544,475 1530,489 1450,489"/>
    <polygon points="1450,506 1530,506 1544,520 1530,534 1450,534"/>
    <polygon points="1450,606 1530,606 1544,620 1530,634 1450,634"/>
    <polygon points="1450,776 1530,776 1544,790 1530,804 1450,804"/>
  </g>
  <g font-size="13" fill="#000" text-anchor="middle">
    <text x="92" y="180">a[31:0]</text>
    <text x="92" y="725">b[31:0]</text>
    <text x="92" y="905">op[1:0]</text>
    <text x="492" y="435" font-size="0"> </text>
    <text x="1492" y="435">result[31:0]</text>
    <text x="1492" y="480">zero</text>
    <text x="1492" y="525">negative</text>
    <text x="1492" y="625">carry</text>
    <text x="1492" y="795">overflow</text>
  </g>

  <!-- adders -->
  <g stroke="#000" stroke-width="2" fill="#FFFFFF">
    <rect x="380" y="150" width="100" height="100"/>
    <rect x="380" y="300" width="100" height="100"/>
    <rect x="380" y="460" width="100" height="80"/>
    <rect x="380" y="580" width="100" height="80"/>
  </g>
  <g fill="#000" text-anchor="middle">
    <text x="430" y="213" font-size="38">+</text>
    <text x="430" y="363" font-size="38">+</text>
    <text x="430" y="509" font-size="24">&lt;&lt;</text>
    <text x="430" y="629" font-size="24">&gt;&gt;</text>
  </g>
  <g font-size="11" fill="#333">
    <text x="386" y="179">A</text><text x="386" y="229">B</text>
    <text x="386" y="329">A</text><text x="386" y="379">B</text>
    <text x="430" y="164" text-anchor="middle">cin</text>
    <text x="430" y="314" text-anchor="middle">cin</text>
    <text x="474" y="239" text-anchor="end">cout</text>
    <text x="474" y="389" text-anchor="end">cout</text>
    <text x="474" y="204" text-anchor="end">S</text>
    <text x="474" y="354" text-anchor="end">S</text>
    <text x="386" y="484">D</text><text x="386" y="524">SH</text>
    <text x="386" y="604">D</text><text x="386" y="644">SH</text>
  </g>

  <!-- inverter on b -->
  <polygon points="290,360 290,390 330,375" fill="#FFFFFF" stroke="#000" stroke-width="2"/>
  <circle cx="336" cy="375" r="6" fill="#FFFFFF" stroke="#000" stroke-width="2"/>

  <!-- main mux -->
  <polygon points="640,150 700,190 700,670 640,710" fill="#FFFFFF" stroke="#000" stroke-width="2"/>
  <g font-size="12" fill="#000">
    <text x="646" y="204">00</text><text x="646" y="354">01</text>
    <text x="646" y="504">10</text><text x="646" y="624">11</text>
  </g>

  <!-- flag muxes -->
  <polygon points="1200,560 1240,580 1240,660 1200,680" fill="#FFFFFF" stroke="#000" stroke-width="2"/>
  <polygon points="1200,730 1240,750 1240,830 1200,850" fill="#FFFFFF" stroke="#000" stroke-width="2"/>
  <g font-size="9" fill="#000">
    <text x="1204" y="583">00</text><text x="1204" y="608">01</text><text x="1204" y="633">10</text><text x="1204" y="658">11</text>
    <text x="1204" y="753">00</text><text x="1204" y="778">01</text><text x="1204" y="803">10</text><text x="1204" y="828">11</text>
  </g>

  <!-- gates -->
  <g stroke="#000" stroke-width="2" fill="#FFFFFF">
    <use href="#nor" xlink:href="#nor" x="940" y="455"/>
    <use href="#xnor" xlink:href="#xnor" x="900" y="700"/>
    <use href="#xor" xlink:href="#xor" x="900" y="760"/>
    <use href="#and" xlink:href="#and" x="1040" y="730"/>
    <use href="#xor" xlink:href="#xor" x="900" y="820"/>
    <use href="#xor" xlink:href="#xor" x="900" y="880"/>
    <use href="#and" xlink:href="#and" x="1040" y="850"/>
  </g>

  <!-- net labels -->
  <g font-size="13" fill="#000">
    <text x="430" y="126" text-anchor="middle">1'b0</text>
    <text x="430" y="276" text-anchor="middle">1'b1</text>
    <text x="519" y="239">c_add</text>
    <text x="519" y="389">c_sub</text>
    <text x="510" y="193">s[31:0]</text>
    <text x="510" y="343">d[31:0]</text>
    <text x="510" y="493">sll[31:0]</text>
    <text x="510" y="613">srl[31:0]</text>
    <text x="262" y="512">[4:0]</text>
    <text x="262" y="632">[4:0]</text>
    <text x="262" y="367">~b</text>
    <text x="712" y="422">result[31:0]</text>
    <text x="808" y="512">result[31]</text>
    <text x="1156" y="584" text-anchor="end">c_add</text>
    <text x="1156" y="609" text-anchor="end">c_sub</text>
    <text x="1156" y="634" text-anchor="end">1'b0</text>
    <text x="1156" y="659" text-anchor="end">1'b0</text>
    <text x="1220" y="705" text-anchor="middle">op[1:0]</text>
    <text x="856" y="714" text-anchor="end">a[31]</text>
    <text x="856" y="734" text-anchor="end">b[31]</text>
    <text x="856" y="774" text-anchor="end">s[31]</text>
    <text x="856" y="794" text-anchor="end">a[31]</text>
    <text x="856" y="834" text-anchor="end">a[31]</text>
    <text x="856" y="854" text-anchor="end">b[31]</text>
    <text x="856" y="894" text-anchor="end">d[31]</text>
    <text x="856" y="914" text-anchor="end">a[31]</text>
    <text x="1100" y="743">v_add</text>
    <text x="1118" y="768">v_sub</text>
    <text x="1156" y="804" text-anchor="end">1'b0</text>
    <text x="1156" y="829" text-anchor="end">1'b0</text>
    <text x="1220" y="876" text-anchor="middle">op[1:0]</text>
  </g>

  <!-- notes -->
  <g font-size="13" fill="#000">
    <text x="50" y="972" font-weight="700">NOTES:</text>
    <text x="50" y="992">1. op: 00 = ADD, 01 = SUB, 10 = SLL, 11 = SRL.</text>
    <text x="50" y="1010">2. Adders are 33-bit; bit 32 drives cout. SUB computes a + ~b + 1.</text>
    <text x="50" y="1028" font-size="0"> </text>
  </g>
  <g font-size="13" fill="#000">
    <text x="610" y="992">3. Shift amount uses b[4:0] only; vacated bits filled with 0.</text>
    <text x="610" y="1010">4. Net labels with the same name are connected.</text>
  </g>

  <!-- title block -->
  <g stroke="#000" stroke-width="1.5" fill="none">
    <rect x="1150" y="950" width="420" height="80"/>
    <line x1="1150" y1="985" x2="1570" y2="985"/>
    <line x1="1150" y1="1008" x2="1570" y2="1008"/>
    <line x1="1290" y1="985" x2="1290" y2="1030"/>
    <line x1="1430" y1="985" x2="1430" y2="1030"/>
  </g>
  <g fill="#000">
    <text x="1158" y="963" font-size="9" fill="#444">TITLE</text>
    <text x="1360" y="979" font-size="17" font-weight="700" text-anchor="middle">32-BIT ALU — RTL SCHEMATIC</text>
    <text x="1156" y="996" font-size="9" fill="#444">SOURCE</text>
    <text x="1220" y="1003" font-size="13" text-anchor="middle">ALU.v</text>
    <text x="1296" y="996" font-size="9" fill="#444">DATE</text>
    <text x="1360" y="1003" font-size="13" text-anchor="middle">2026-11-22</text>
    <text x="1436" y="996" font-size="9" fill="#444">REV</text>
    <text x="1500" y="1003" font-size="13" text-anchor="middle">A</text>
    <text x="1156" y="1019" font-size="9" fill="#444">SIZE</text>
    <text x="1220" y="1025" font-size="13" text-anchor="middle">B</text>
    <text x="1296" y="1019" font-size="9" fill="#444">SCALE</text>
    <text x="1360" y="1025" font-size="13" text-anchor="middle">NONE</text>
    <text x="1436" y="1019" font-size="9" fill="#444">SHEET</text>
    <text x="1500" y="1025" font-size="13" text-anchor="middle">1 OF 1</text>
  </g>
</svg>
